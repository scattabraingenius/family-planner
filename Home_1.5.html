<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — Family Day Planner</title>
<style>
  /* ============================================================
     HOME — family day planner   (v1.5)
     One shared day list (multi-person tags), Places to Go + Shopping list.
     Optional live cloud sync across devices (Firebase — see config block).
     Self-contained, offline, saves to localStorage.
     Edit SEED_PEOPLE / palette to taste.
     ============================================================ */
  :root {
    color-scheme: dark;
    --paper:#0B0F17; --card:#151C27; --surface-2:#1E2733; --input-bg:#0F1622; --done-bg:#0E141D; --track:#26313F;
    --ink:#E6EDF3; --muted:#93A1B0; --muted-2:#66788B; --line:#26313F;
    --signal:#16BBD4; --signal-dim:#52D2E2;
    --star:#F2C14E; --alarm:#F0575C;
    --radius:12px;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media print {
    :root { color-scheme:light; --paper:#fff; --card:#fff; --surface-2:#fff; --input-bg:#fff; --done-bg:#fff; --track:#e2e2e2;
      --ink:#111; --muted:#444; --muted-2:#777; --line:#c4c4c4; --signal:#0E90A4; --shadow:none; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body { background:#fff; }
    .wrap { padding:0; max-width:none; }
    .toolbar, .rowactions, .clock, .nextup, .util, .peoplebar .pb-edit, .row.parked, .add-inline, .shop-clear, .people-editor { display:none !important; }
    .panels { grid-template-columns:1fr 1fr; gap:16px; }
    .row, .shop-row { break-inside:avoid; box-shadow:none !important; }
    header.top { margin-bottom:8px; }
  }
  * { box-sizing:border-box; } html,body{ margin:0; }
  body { font-family:var(--sans); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4; }
  .wrap { max-width:1160px; margin:0 auto; padding:20px 20px 80px; }
  .hidden { display:none !important; }
  .eyebrow { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-2); }

  /* header */
  header.top { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand h1 { font-size:26px; margin:0; letter-spacing:-.02em; font-weight:800; }
  .brand .datestr { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .head-right { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .clock { font-family:var(--mono); font-size:20px; font-weight:600; }
  .clock .sec { color:var(--signal); }
  .progress-wrap { min-width:180px; }
  .progress-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:12px; }
  .progress-count { font-family:var(--mono); font-size:13px; font-weight:600; }
  .bar { height:8px; background:var(--track); border-radius:99px; overflow:hidden; width:180px; }
  .bar > span { display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--signal),#23B877); border-radius:99px; transition:width .35s ease; }
  .util { display:flex; gap:8px; align-items:center; }
  .sync-badge { font-family:var(--mono); font-size:11px; font-weight:600; margin-right:2px; white-space:nowrap; }

  .btn { font-family:var(--sans); font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 12px; border-radius:10px; cursor:pointer; box-shadow:var(--shadow); white-space:nowrap; }
  .btn:hover { border-color:var(--muted-2); }
  .btn.add { background:var(--signal); border-color:var(--signal); color:#04333B; }
  .btn.sm { padding:5px 9px; font-size:12px; }

  /* next up */
  .nextup { background:radial-gradient(120% 140% at 0% 0%, #163039 0%, #0D1621 60%); border:1px solid #1E4653; box-shadow:0 0 0 1px rgba(22,187,212,.14), 0 12px 34px rgba(0,0,0,.45); border-radius:16px; padding:16px 18px; display:flex; align-items:center; gap:16px; margin-bottom:16px; color:#EAF1F7; }
  .nextup .lead { flex:1; min-width:0; }
  .nextup .eyebrow { color:#5F7488; }
  .nextup .title { font-size:19px; font-weight:700; margin:3px 0; }
  .nextup .meta { font-family:var(--mono); font-size:12.5px; color:#9FB2C4; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .nextup .readout { text-align:right; font-family:var(--mono); flex:none; }
  .nextup .readout .count { font-size:24px; font-weight:700; color:var(--signal-dim); }
  .nextup .readout .subl { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#5F7488; }
  .nextup.empty { color:#8AA0B4; justify-content:flex-start; }

  /* people bar */
  .peoplebar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .pfilter { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; padding:6px 12px 6px 8px; border-radius:99px; background:var(--card); border:1px solid var(--line); cursor:pointer; color:var(--ink); }
  .pfilter .dot { width:14px; height:14px; border-radius:50%; flex:none; }
  .pfilter.active { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
  .pfilter.all { padding-left:12px; }
  .pb-edit { margin-left:auto; }

  .people-editor { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px; box-shadow:var(--shadow); }
  .pe-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .pe-row .swatch { width:24px; height:24px; border-radius:50%; border:2px solid var(--line); cursor:pointer; flex:none; }
  .pe-row input { flex:1; font-size:14px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--ink); outline:none; }
  .pe-row input:focus { border-color:var(--signal); }
  .pe-row .rm { color:var(--muted-2); background:none; border:1px solid var(--line); border-radius:8px; width:30px; height:30px; cursor:pointer; }
  .pe-row .rm:hover { color:var(--alarm); border-color:var(--alarm); }

  /* panels */
  .panels { display:grid; grid-template-columns:1fr 330px; gap:18px; align-items:start; }
  @media (max-width:820px){ .panels { grid-template-columns:1fr; } }
  .panel-title { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2); margin:0 2px 10px; display:flex; justify-content:space-between; align-items:center; }

  /* day toolbar */
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .quickadd { flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:4px 4px 4px 14px; box-shadow:var(--shadow); }
  .quickadd input { flex:1; border:none; outline:none; font-size:15px; background:transparent; padding:8px 0; color:var(--ink); }
  .quickadd .plus { font-family:var(--mono); color:var(--signal-dim); font-size:18px; font-weight:700; }
  select.ctrl, input.search { font-family:var(--sans); font-size:13px; color:var(--ink); border:1px solid var(--line); background:var(--card); border-radius:10px; padding:8px 10px; box-shadow:var(--shadow); cursor:pointer; }
  input.search { min-width:120px; cursor:text; }
  label.toggle { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; }

  /* day list */
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { display:grid; grid-template-columns:24px 52px minmax(66px,138px) minmax(0,1fr) 76px 122px 66px; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:var(--radius); padding:11px 14px; box-shadow:var(--shadow); }
  .row.overdue { border-left-color:var(--alarm); }
  .row.isnext { box-shadow:0 0 0 2px var(--signal), var(--shadow); }
  .row.done { opacity:.5; background:var(--done-bg); }
  .row.done .task-title { text-decoration:line-through; color:var(--muted); }
  .row.parked { opacity:.62; background:var(--done-bg); border-left-color:#9B87F5; }

  .cbx { appearance:none; -webkit-appearance:none; width:20px; height:20px; border:2px solid var(--muted-2); border-radius:6px; cursor:pointer; position:relative; flex:none; background:var(--card); }
  .cbx:checked { background:#23B877; border-color:#23B877; }
  .cbx:checked::after { content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(42deg); }
  .cbx:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }

  .pri { font-family:var(--mono); font-weight:700; font-size:15px; color:#fff; border-radius:8px; height:34px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
  .pri .fill { height:3px; width:80%; background:rgba(255,255,255,.5); border-radius:2px; margin-top:2px; }
  .pri .fill > i { display:block; height:100%; background:#fff; border-radius:2px; }
  .prislider { display:flex; align-items:center; gap:12px; }
  .prislider input[type=range] { flex:1; accent-color:var(--sliderc,var(--signal)); }
  .prival { font-family:var(--mono); font-weight:700; font-size:18px; color:#fff; width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .nextup .gauge { width:52px; height:52px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:22px; color:#fff; }

  .pchip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px 4px 4px; border-radius:99px; white-space:nowrap; color:#0B0F17; }
  .pchip .dot { width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,.18); flex:none; }
  .pchip.none { background:var(--surface-2); color:var(--muted-2); border:1px dashed var(--line); }

  .task-title { font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task-title .star { color:var(--star); margin-right:4px; }
  .task-meta { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task-meta .due { font-weight:600; color:var(--muted); }
  .task-meta .due.over { color:var(--alarm); } .task-meta .due.today { color:var(--star); } .task-meta .due.soon { color:var(--signal-dim); }
  .task-meta .re { color:#9B87F5; }
  .cell-time { font-family:var(--mono); font-size:13px; text-align:center; }
  .cell-time .cd { display:block; font-size:10.5px; margin-top:1px; color:var(--signal-dim); }
  .cell-time .t.none { color:var(--muted-2); }

  .status-sel { font-family:var(--sans); font-size:12px; font-weight:600; border:none; border-radius:99px; padding:6px 8px; color:#fff; cursor:pointer; width:100%; text-align:center; -webkit-appearance:none; appearance:none; }
  .rowactions { display:flex; gap:4px; justify-content:flex-end; }
  .iconbtn { border:1px solid var(--line); background:var(--card); border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .iconbtn:hover { color:var(--ink); border-color:var(--muted-2); }
  .iconbtn.del:hover { color:var(--alarm); border-color:var(--alarm); }
  .later-head { font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9B87F5; margin:6px 2px 2px; }

  /* editor */
  .editor { background:var(--card); border:1px solid var(--signal); border-radius:var(--radius); padding:16px; box-shadow:0 0 0 3px rgba(18,176,201,.12), var(--shadow); }
  .editor .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px 16px; }
  .field { display:flex; flex-direction:column; gap:4px; } .field.full { grid-column:1/-1; }
  .field label { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .field input[type=text], .field input[type=time], .field input[type=date], .field input[type=datetime-local], .field textarea, .field select { font-family:var(--sans); font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--ink); outline:none; width:100%; }
  .field textarea { resize:vertical; min-height:44px; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--signal); box-shadow:0 0 0 3px rgba(18,176,201,.14); }
  .starbox { display:inline-flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; user-select:none; padding:8px 0; }
  .reappear-inline { display:flex; gap:8px; align-items:center; } .reappear-inline input { flex:1; }
  .editor .actions { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }

  /* multi-person picker */
  .who-picker { display:flex; flex-wrap:wrap; gap:6px; }
  .who-opt { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 10px 5px 7px; border-radius:99px; background:var(--input-bg); border:1px solid var(--line); color:var(--muted); cursor:pointer; }
  .who-opt .dot { width:12px; height:12px; border-radius:50%; opacity:.45; }
  .who-opt.on { color:var(--ink); border-color:var(--ink); }
  .who-opt.on .dot { opacity:1; }

  /* multi-person chips in a row (compact, wrap) */
  .r-who { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .r-who .pchip { font-size:11px; padding:3px 8px 3px 3px; }
  .r-who .pchip .dot { width:13px; height:13px; }

  /* late / overdue accents */
  .cell-time .cd.late { color:var(--alarm); font-weight:600; }
  .overdue-chip { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--alarm); margin-left:8px; white-space:nowrap; }

  /* right sidebar: Places to Go (above Shopping) */
  .side { display:flex; flex-direction:column; gap:18px; }
  .places { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
  .place-list { display:flex; flex-direction:column; gap:6px; }
  .place-row { display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); }
  .place-row.got { opacity:.5; } .place-row.got .place-name { text-decoration:line-through; color:var(--muted); }
  .place-body { flex:1; min-width:0; }
  .place-name { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .place-meta { font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:1px; }
  .place-meta .ptxt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .place-meta .pdot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .mapbtn { font-size:11px; font-weight:600; color:var(--signal); background:none; border:1px solid var(--line); border-radius:7px; padding:5px 9px; cursor:pointer; text-decoration:none; white-space:nowrap; flex:none; }
  .mapbtn:hover { border-color:var(--signal); }
  .place-del, .place-edit { color:var(--muted-2); background:none; border:none; cursor:pointer; font-size:13px; padding:2px 3px; flex:none; }
  .place-del:hover { color:var(--alarm); } .place-edit:hover { color:var(--ink); }
  .place-editor { border:1px solid var(--signal); border-radius:9px; padding:10px; background:var(--input-bg); box-shadow:0 0 0 2px rgba(18,176,201,.1); }
  .place-editor .pe-field { display:flex; flex-direction:column; gap:3px; margin-bottom:8px; }
  .place-editor label { font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .place-editor input[type=text], .place-editor input[type=date] { font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink); outline:none; width:100%; }
  .place-editor input:focus { border-color:var(--signal); }
  .place-editor .who-opt { font-size:11px; padding:4px 8px 4px 6px; }
  .place-editor .pe-actions { display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }

  /* shopping */
  .shop { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
  .add-inline { display:flex; align-items:center; gap:8px; background:var(--input-bg); border:1px solid var(--line); border-radius:10px; padding:3px 3px 3px 12px; margin-bottom:12px; }
  .add-inline input { flex:1; border:none; outline:none; background:transparent; font-size:14px; color:var(--ink); padding:8px 0; }
  .add-inline .plus { font-family:var(--mono); color:var(--signal-dim); font-weight:700; }
  .shop-list { display:flex; flex-direction:column; gap:6px; }
  .shop-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); }
  .shop-row.got { opacity:.5; } .shop-row.got .shop-text { text-decoration:line-through; color:var(--muted); }
  .shop-text { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shop-del { color:var(--muted-2); background:none; border:none; cursor:pointer; font-size:14px; }
  .shop-del:hover { color:var(--alarm); }
  .shop-foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .shop-count { font-family:var(--mono); font-size:11.5px; color:var(--muted-2); }
  .shop-clear { font-size:12px; color:var(--muted); background:none; border:1px solid var(--line); border-radius:8px; padding:5px 9px; cursor:pointer; }
  .shop-clear:hover { border-color:var(--muted-2); color:var(--ink); }

  .empty-state { text-align:center; padding:40px 16px; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius); background:var(--card); }
  .empty-state .big { font-size:16px; font-weight:600; color:var(--ink); margin-bottom:5px; }
  .hint { font-size:11.5px; color:var(--muted-2); margin-top:22px; text-align:center; font-family:var(--mono); }

  @media (max-width:640px){
    .row { grid-template-columns:24px 48px 1fr auto; grid-template-areas:"cbx pri who actions" "cbx pri title title" "cbx pri meta meta" "cbx pri status status"; row-gap:7px; }
    .row > .cbx { grid-area:cbx; } .row > .pri{ grid-area:pri; align-self:start; } .r-who{ grid-area:who; } .r-title{ grid-area:title; } .r-meta{ grid-area:meta; display:flex; gap:12px; flex-wrap:wrap;} .r-status{ grid-area:status;} .rowactions{ grid-area:actions;}
    .cell-time{ text-align:left; }
    .editor .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>Home</h1>
      <div><div class="eyebrow">Family day planner</div><div class="datestr" id="datestr"></div></div>
    </div>
    <div class="head-right">
      <div class="clock" id="clock">--:--<span class="sec">:--</span></div>
      <div class="progress-wrap">
        <div class="progress-top"><span class="eyebrow">Today</span><span class="progress-count" id="progressCount">0 of 0 done</span><span class="overdue-chip" id="overdueChip"></span></div>
        <div class="bar"><span id="progressBar"></span></div>
      </div>
      <div class="util">
        <span class="sync-badge" id="syncBadge"></span>
        <button class="btn sm" id="printBtn">🖨 Print</button>
        <button class="btn sm" id="exportBtn">Export</button>
        <button class="btn sm" id="importBtn">Import</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </header>

  <div class="nextup empty" id="nextup"></div>

  <div class="peoplebar" id="peoplebar"></div>
  <div class="people-editor hidden" id="peopleEditor"></div>

  <div class="panels">
    <div>
      <div class="toolbar">
        <div class="quickadd"><span class="plus">+</span><input id="quickInput" type="text" placeholder="Add to the day, then Enter…" aria-label="Quick add"></div>
        <button class="btn add" id="addBtn">+ Add</button>
        <input class="search" id="searchInput" type="text" placeholder="Search…">
        <select class="ctrl" id="sortBy" aria-label="Sort">
          <option value="time">Sort: Time</option>
          <option value="priority">Sort: Priority</option>
          <option value="person">Sort: Person</option>
          <option value="added">Sort: Added</option>
        </select>
        <label class="toggle"><input type="checkbox" id="hideDone"> Hide done</label>
        <label class="toggle"><input type="checkbox" id="showLater"> <span id="laterLbl">Later</span></label>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="side">
      <div class="places">
        <div class="panel-title">Places to go <span class="shop-count" id="placeCount"></span></div>
        <div class="add-inline"><span class="plus">+</span><input id="placeInput" type="text" placeholder="Add a place, then Enter…" aria-label="Add place"></div>
        <div class="place-list" id="placeList"></div>
        <div class="shop-foot"><span class="shop-count" id="placeStatus"></span><button class="shop-clear" id="placeClear">Clear visited</button></div>
      </div>

      <div class="shop">
        <div class="panel-title">Shopping list <span class="shop-count" id="shopCount"></span></div>
        <div class="add-inline"><span class="plus">+</span><input id="shopInput" type="text" placeholder="Add an item, then Enter…" aria-label="Add shopping item"></div>
        <div class="shop-list" id="shopList"></div>
        <div class="shop-foot"><span class="shop-count" id="shopStatus"></span><button class="shop-clear" id="shopClear">Clear got items</button></div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
"use strict";
const VERSION = "1.5";

/* ---------------- storage ---------------- */
const K_TASKS="home.plan.v1", K_SHOP="home.shopping.v1", K_PEOPLE="home.people.v1", K_PLACES="home.places.v1";
function loadJSON(k){ try{ const r=localStorage.getItem(k); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveTasks(){ try{ localStorage.setItem(K_TASKS, JSON.stringify(tasks)); }catch(e){} pushCloud(); return true; }
function saveShop(){ try{ localStorage.setItem(K_SHOP, JSON.stringify(shop)); }catch(e){} pushCloud(); }
function savePeople(){ try{ localStorage.setItem(K_PEOPLE, JSON.stringify(people)); }catch(e){} pushCloud(); }
function savePlaces(){ try{ localStorage.setItem(K_PLACES, JSON.stringify(places)); }catch(e){} pushCloud(); }

/* =====================================================================
   CLOUD SYNC (optional) — share one LIVE planner across all devices.
   1. Create a free Firebase project + Realtime Database (see notes).
   2. Paste the config object below and pick a FAMILY_ID.
   3. Use the SAME file/config on every phone & computer.
   Leave apiKey blank to run local-only on this device (still works).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDTcQiFsjhSzlsEl7uPJvTtsxp798XOqIQ",
  authDomain: "family-planner-ccafc.firebaseapp.com",
  databaseURL: "https://family-planner-ccafc-default-rtdb.firebaseio.com",
  projectId: "family-planner-ccafc"
};
const FAMILY_ID = "ccafc-home";   // any unique word — must match on every device

let db=null, syncing=false, remoteApplying=false, pushTimer=null;
function syncConfigured(){ return typeof firebase!=="undefined" && !!FIREBASE_CONFIG.apiKey && !!FIREBASE_CONFIG.databaseURL; }
function initSync(){
  if(!syncConfigured()){ updateSyncBadge(false); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database().ref("planners/"+FAMILY_ID);
    syncing=true; updateSyncBadge(true);
    db.on("value", snap=>{
      const v=snap.val();
      if(!v){ pushCloud(true); return; }                 // cloud empty → seed from this device
      remoteApplying=true;
      if(Array.isArray(v.people)) people=v.people;
      if(Array.isArray(v.tasks))  tasks=v.tasks.map(migrateTask);
      if(Array.isArray(v.shop))   shop=v.shop.map(s=>Object.assign(blankShop(),s));
      if(Array.isArray(v.places)) places=v.places.map(migratePlace);   // only overwrite if present → never erased by an old client
      try{ localStorage.setItem(K_PEOPLE,JSON.stringify(people)); localStorage.setItem(K_TASKS,JSON.stringify(tasks)); localStorage.setItem(K_SHOP,JSON.stringify(shop)); localStorage.setItem(K_PLACES,JSON.stringify(places)); }catch(e){}
      remoteApplying=false;
      if(editingId==null) render();
    });
    firebase.database().ref(".info/connected").on("value", s=>{ if(syncing) updateSyncBadge(s.val()===true); });
  }catch(e){ syncing=false; updateSyncBadge(false); }
}
function pushCloud(force){
  if(!syncing || (remoteApplying && !force)) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ try{ db.set({people,tasks,shop,places,updated:Date.now()}); }catch(e){} }, 250);
}
function updateSyncBadge(on){
  const el=document.getElementById("syncBadge"); if(!el) return;
  if(!syncConfigured()){ el.textContent="○ Local only"; el.style.color="var(--muted-2)"; el.title="Add your Firebase config to sync across devices"; return; }
  el.textContent = on ? "● Synced" : "● Offline"; el.style.color = on ? "#23B877" : "var(--star)";
  el.title = on ? "Live sync on" : "Reconnecting…";
}

/* ---------------- family + palette ---------------- */
const PALETTE=["#16BBD4","#F06595","#9B87F5","#F2A81D","#23B877","#F0575C","#3B97E6","#E8A0C0"];
const SEED_PEOPLE=[
  {id:"p1",name:"Dad",  color:"#16BBD4"},
  {id:"p2",name:"Bella",color:"#F06595"},
  {id:"p3",name:"Abby", color:"#9B87F5"},
  {id:"p4",name:"Ariel",color:"#F2A81D"},
];
let people = loadJSON(K_PEOPLE) || SEED_PEOPLE.slice();
function uid(p){ return (p||"t")+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function getPerson(id){
  if(id==="family") return {id:"family",name:"Family",color:"#8595A8"};
  const p=people.find(x=>x.id===id); return p || {id:"",name:"Unassigned",color:"#3A4757",none:true};
}

/* ---------------- tasks / shopping / places ---------------- */
/* Task now stores a `people` array. "family" as a member id = everyone (exclusive).
   Old tasks used a single `person` string — migrateTask converts them, no data loss. */
function blankTask(name){ return { id:uid("t"), people:[], task:name||"", time:"", due:"", dueTime:"", priority:5, status:"todo", showOn:"", notes:"", created:Date.now() }; }
function blankShop(name){ return { id:uid("s"), item:name||"", got:false }; }
function blankPlace(name){ return { id:uid("pl"), name:name||"", address:"", note:"", date:"", people:[], visited:false, created:Date.now() }; }

function normPeople(arr){ if(!Array.isArray(arr)) return []; if(arr.includes("family")) return ["family"]; return arr.filter(x=>x); }
function migrateTask(raw){
  const t=Object.assign(blankTask(), raw||{});
  if((!Array.isArray(t.people)||!t.people.length) && raw && raw.person){   // old single-person → array
    t.people = raw.person==="family" ? ["family"] : [raw.person];
  }
  t.people=normPeople(t.people);
  delete t.person;
  if(typeof t.created!=="number") t.created=Date.now();
  return t;
}
function migratePlace(raw){ const p=Object.assign(blankPlace(), raw||{}); p.people=normPeople(p.people); if(typeof p.created!=="number") p.created=Date.now(); return p; }

let tasks = loadJSON(K_TASKS); if(!tasks){ tasks=[]; saveTasks(); }
tasks = tasks.map(migrateTask);
let shop = (loadJSON(K_SHOP) || []).map(s=>Object.assign(blankShop(),s));
let places = (loadJSON(K_PLACES) || []).map(migratePlace);

/* ---------------- state ---------------- */
let editingId=null, placeEditingId=null, activePerson="all", overdueSet=new Set();
const STATUS={ todo:{label:"To do",color:"#7C8B9C"}, doing:{label:"Doing",color:"#3B97E6"}, done:{label:"Done",color:"#23B877"}, later:{label:"Later",color:"#9B87F5"} };

/* ---------------- helpers ---------------- */
function pad2(x){ return String(x).padStart(2,"0"); }
function priColor(p){ const green=[0x23,0xB8,0x77],amber=[0xF2,0xA8,0x1D],red=[0xF0,0x57,0x5C]; const t=(Math.min(10,Math.max(1,p))-1)/9; const mix=(a,b,u)=>a.map((x,i)=>Math.round(x+(b[i]-x)*u)); const c=t<=0.5?mix(green,amber,t/0.5):mix(amber,red,(t-0.5)/0.5); return "#"+c.map(x=>x.toString(16).padStart(2,"0")).join(""); }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function timeToMin(h){ if(!h) return null; const [a,b]=h.split(":").map(Number); return a*60+b; }
function fmtDelta(m){ const a=Math.abs(m); if(a>=60){ const h=Math.floor(a/60),n=a%60; return n?`${h}h ${n}m`:`${h}h`; } return a+"m"; }
function fmt12(hhmm){ if(!hhmm) return ""; let [h,m]=hhmm.split(":").map(Number); const ap=h<12?"AM":"PM"; h=h%12||12; return `${h}:${pad2(m)} ${ap}`; }
function fmtDate(ymd){ const d=new Date(ymd+"T00:00"); return isNaN(d)?ymd:d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtWhen(iso){ const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function isDone(t){ return t.status==="done"; }
function isLater(t){ return t.status==="later"; }
function isActive(t){ return t.status==="todo"||t.status==="doing"; }
function esc(s){ return (s??"").toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function taskPeopleIds(t){ return Array.isArray(t.people)?t.people:[]; }
function isFamilyTask(t){ return taskPeopleIds(t).includes("family"); }
/* a task "counts toward today" if it's undated (a floating today task) or due today; not later */
function isToday(t){ if(isLater(t)) return false; if(!t.due) return true; return t.due===todayStr(); }
function personSortKey(t){ const ids=taskPeopleIds(t); if(!ids.length) return "~~~~"; if(ids.includes("family")) return "\u0000Family"; return getPerson(ids[0]).name; }
function tomorrowLocal(timeStr){ const d=new Date(); d.setDate(d.getDate()+1); const t=/^\d{2}:\d{2}$/.test(timeStr||"")?timeStr:"08:00"; return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${t}`; }
function dueMoment(t){ if(!t.due) return null; const tm=/^\d{2}:\d{2}$/.test(t.dueTime||"")?t.dueTime:"23:59"; const d=new Date(`${t.due}T${tm}`); return isNaN(d)?null:d; }
function isOverdue(t){ if(!isActive(t)) return false; return !!t.due && t.due < todayStr(); }
function dueBadge(t){ if(!t.due||isDone(t)) return "";
  const ts=todayStr();
  if(t.due < ts) return `<span class="due over">⚠ Overdue · was due ${esc(fmtDate(t.due))}</span>`;
  if(t.due === ts) return `<span class="due today">due today${t.dueTime?" "+esc(fmt12(t.dueTime)):""}</span>`;
  const dd=new Date(t.due+"T00:00"), today=new Date(ts+"T00:00"); const diff=Math.round((dd-today)/86400000);
  if(diff===1) return `<span class="due soon">due tomorrow</span>`;
  return `<span class="due">due ${esc(fmtDate(t.due))}</span>`;
}
function normalizeLater(){ let ch=false; const now=new Date(); tasks.forEach(t=>{ if(isLater(t)&&t.showOn&&new Date(t.showOn)<=now){ t.status="todo"; t.showOn=""; ch=true; } }); if(ch) saveTasks(); return ch; }

/* ---------------- next up ---------------- */
function personVisible(t){ if(activePerson==="all") return true; if(isFamilyTask(t)) return true; return taskPeopleIds(t).includes(activePerson); }
/* Up Next = soonest FUTURE timed task today. Missed (past-time) tasks are flagged in their row, not here. */
function computeNextUp(){
  const nm=nowMin();
  const c=tasks.filter(t=>isActive(t)&&isToday(t)&&personVisible(t)&&timeToMin(t.time)!=null&&timeToMin(t.time)>=nm);
  if(!c.length) return null;
  c.sort((a,b)=>timeToMin(a.time)-timeToMin(b.time));
  return c[0];
}
/* colored chips for a task's assigned people (Family collapses to one chip) */
function peopleChipsHtml(ids){
  ids = normPeople(ids);
  if(!ids.length) return `<span class="pchip none"><span class="dot"></span>—</span>`;
  if(ids.includes("family")){ const f=getPerson("family"); return `<span class="pchip" style="background:${f.color}"><span class="dot"></span>Family</span>`; }
  return ids.map(id=>{ const p=getPerson(id); return `<span class="pchip" style="background:${p.color}"><span class="dot"></span>${esc(p.name)}</span>`; }).join("");
}
/* incomplete active tasks assigned to this person (family tasks count for everyone) */
function personCount(pid){ return tasks.filter(t=>isActive(t) && (isFamilyTask(t)||taskPeopleIds(t).includes(pid))).length; }
/* reusable multi-person selector; returns { get:()=>ids }. Family and individuals are mutually exclusive. */
function makeWhoPicker(container, initial){
  let sel = normPeople(initial);
  function paint(){
    const opt=(id,name,color,on)=>`<button type="button" class="who-opt ${on?'on':''}" data-id="${id}"><span class="dot" style="background:${color}"></span>${esc(name)}</button>`;
    container.innerHTML = opt("family","Family",getPerson("family").color,sel.includes("family")) +
      people.map(p=>opt(p.id,p.name,p.color,sel.includes(p.id))).join("");
    container.querySelectorAll(".who-opt").forEach(b=>b.addEventListener("click",()=>{
      const id=b.dataset.id;
      if(id==="family") sel = sel.includes("family") ? [] : ["family"];
      else { sel=sel.filter(x=>x!=="family"); sel = sel.includes(id) ? sel.filter(x=>x!==id) : [...sel,id]; }
      paint();
    }));
  }
  paint();
  return { get:()=>normPeople(sel) };
}

/* ---------------- render ---------------- */
const listEl=document.getElementById("list"), nextEl=document.getElementById("nextup");

function currentView(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const sort=document.getElementById("sortBy").value;
  const hideDone=document.getElementById("hideDone").checked;
  const showLater=document.getElementById("showLater").checked;
  let v=tasks.filter(t=>{
    if(!personVisible(t)) return false;
    if(isLater(t)&&!showLater) return false;
    if(hideDone&&isDone(t)) return false;
    if(q){ const names=taskPeopleIds(t).map(id=>getPerson(id).name).join(" "); const hay=[t.task,t.notes,names].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const cmp={
    time:(a,b)=>(timeToMin(a.time)??1e9)-(timeToMin(b.time)??1e9),
    priority:(a,b)=>(b.priority||0)-(a.priority||0),
    person:(a,b)=>personSortKey(a).localeCompare(personSortKey(b)),
    added:(a,b)=>(b.created||0)-(a.created||0),
  }[sort] || ((a,b)=>0);
  const secondary=(a,b)=> ((b.priority||0)-(a.priority||0)) || ((timeToMin(a.time)??1e9)-(timeToMin(b.time)??1e9));
  const tier=t=>isLater(t)?2:isDone(t)?1:0;
  v.sort((a,b)=>(tier(a)-tier(b)) || cmp(a,b) || secondary(a,b));
  return v;
}

function render(){
  normalizeLater();
  renderPeopleBar();
  renderShop();
  renderPlaces();
  const view=currentView();
  const next=computeNextUp();
  const laterCount=tasks.filter(isLater).length;
  document.getElementById("laterLbl").textContent=laterCount?`Later (${laterCount})`:"Later";
  renderNextUp(next);
  renderProgress();

  listEl.innerHTML="";
  if(!tasks.length){ listEl.innerHTML=`<div class="empty-state"><div class="big">No plans yet.</div>Add the first thing for today above, and tag who it's for.</div>`; }
  else if(!view.length){ listEl.innerHTML=`<div class="empty-state"><div class="big">Nothing here.</div>Try another person or clear filters.</div>`; }
  overdueSet=new Set(); let laterShown=false;
  view.forEach(t=>{
    if(isLater(t)&&!laterShown){ const h=document.createElement("div"); h.className="later-head"; h.textContent="◴ Moved to later"; listEl.appendChild(h); laterShown=true; }
    if(editingId===t.id) listEl.appendChild(renderEditor(t)); else listEl.appendChild(renderRow(t,next&&next.id===t.id));
    if(isOverdue(t)) overdueSet.add(t.id);
  });

  const done=tasks.filter(isDone).length; const over=tasks.filter(isOverdue).length;
  document.getElementById("hint").textContent=`${tasks.length} items • ${done} done • ${over} overdue • ${laterCount} later • ${places.filter(p=>!p.visited).length} places • ${shop.filter(s=>!s.got).length} to buy • Home v${VERSION}`;
}

function renderProgress(){
  const todays=tasks.filter(isToday); const tot=todays.length; const done=todays.filter(isDone).length;
  document.getElementById("progressCount").textContent=`${done} of ${tot} done`;
  document.getElementById("progressBar").style.width=tot?(done/tot*100)+"%":"0%";
  const over=tasks.filter(isOverdue).length;
  const oc=document.getElementById("overdueChip"); if(oc) oc.textContent = over ? `⚠ ${over} overdue` : "";
}

function renderPeopleBar(){
  const bar=document.getElementById("peoplebar");
  const chip=(id,name,color,all,count)=>`<button class="pfilter ${all?'all':''} ${activePerson===id?'active':''}" data-p="${id}">${all?'':`<span class="dot" style="background:${color}"></span>`}${esc(name)}${(!all&&count)?` (${count})`:''}</button>`;
  let html=chip("all","Everyone","",true,0);
  people.forEach(p=>html+=chip(p.id,p.name,p.color,false,personCount(p.id)));
  html+=`<button class="btn sm pb-edit" id="pbEdit">Edit family</button>`;
  bar.innerHTML=html;
  bar.querySelectorAll(".pfilter").forEach(b=>b.addEventListener("click",()=>{ activePerson=b.dataset.p; render(); }));
  document.getElementById("pbEdit").addEventListener("click",togglePeopleEditor);
}

function togglePeopleEditor(){ const pe=document.getElementById("peopleEditor"); pe.classList.toggle("hidden"); if(!pe.classList.contains("hidden")) renderPeopleEditor(); }
function renderPeopleEditor(){
  const pe=document.getElementById("peopleEditor");
  pe.innerHTML=`<div class="panel-title">Family members</div>`+
    people.map(p=>`<div class="pe-row" data-id="${p.id}"><button class="swatch" style="background:${p.color}" title="Change color"></button><input type="text" value="${esc(p.name)}" placeholder="Name"><button class="rm" title="Remove">✕</button></div>`).join("")+
    `<button class="btn sm" id="peAdd">+ Add person</button>`;
  pe.querySelectorAll(".pe-row").forEach(row=>{
    const id=row.dataset.id, p=people.find(x=>x.id===id);
    row.querySelector("input").addEventListener("input",e=>{ p.name=e.target.value; savePeople(); renderPeopleBar(); });
    row.querySelector(".swatch").addEventListener("click",()=>{ const i=PALETTE.indexOf(p.color); p.color=PALETTE[(i+1)%PALETTE.length]; savePeople(); renderPeopleEditor(); renderPeopleBar(); render(); });
    row.querySelector(".rm").addEventListener("click",()=>{ if(confirm(`Remove ${p.name}? They'll be removed from any assigned items.`)){ people=people.filter(x=>x.id!==id); tasks.forEach(t=>{ t.people=taskPeopleIds(t).filter(x=>x!==id); }); places.forEach(pl=>{ pl.people=normPeople(pl.people).filter(x=>x!==id); }); if(activePerson===id) activePerson="all"; savePeople(); saveTasks(); savePlaces(); renderPeopleEditor(); render(); } });
  });
  pe.querySelector("#peAdd").addEventListener("click",()=>{ const color=PALETTE[people.length%PALETTE.length]; people.push({id:uid("p"),name:"New person",color}); savePeople(); renderPeopleEditor(); renderPeopleBar(); });
}

function renderNextUp(t){
  if(!t){ nextEl.className="nextup empty"; nextEl.innerHTML=`<div><div class="eyebrow">Up next</div><div style="font-size:15px;margin-top:3px;color:#B7C6D6">Nothing coming up${activePerson!=='all'?' for '+esc(getPerson(activePerson).name):''}. Add a time to something to see it here.</div></div>`; return; }
  const s=timeToMin(t.time);
  let count,subl;
  if(s!=null){ const d=s-nowMin(); if(d<=0){ count=`<div class="count">now</div>`; subl="Happening now"; } else { count=`<div class="count">${fmtDelta(d)}</div>`; subl="Until"; } }
  else { count=`<div class="count">—</div>`; subl=""; }
  nextEl.className="nextup";
  nextEl.innerHTML=`
    <div class="gauge" style="background:${priColor(t.priority)}">${t.priority}</div>
    <div class="lead"><div class="eyebrow">Up next</div><div class="title">${esc(t.task)||"(untitled)"}</div>
      <div class="meta">
        ${peopleChipsHtml(t.people)}
        ${t.time?`<span><b>${esc(fmt12(t.time))}</b></span>`:""}
        ${t.due?`<span>due ${esc(fmtDate(t.due))}</span>`:""}
      </div></div>
    <div class="readout">${count}<div class="subl">${subl}</div></div>`;
}

function statusOptionsHtml(t){
  const base=[["todo","To do"],["doing","Doing"],["done","Done"],["tomorrow","Move to tomorrow"],["pickday","Move to a day…"]];
  let h=""; if(isLater(t)) h+=`<option value="later" selected>${t.showOn?"Later → "+esc(fmtWhen(t.showOn)):"Later"}</option>`;
  h+=base.map(([v,l])=>`<option value="${v}" ${v===t.status?"selected":""}>${l}</option>`).join(""); return h;
}

function renderRow(t,isNext){
  const el=document.createElement("div");
  el.className="row"+(isDone(t)?" done":"")+(isLater(t)?" parked":"")+(isOverdue(t)?" overdue":"")+(isNext?" isnext":"");
  el.dataset.id=t.id;
  const meta=[]; const db=dueBadge(t); if(db) meta.push(db);
  if(isLater(t)&&t.showOn) meta.push(`<span class="re">↩ ${esc(fmtWhen(t.showOn))}</span>`);
  if(t.notes) meta.push(esc(t.notes));
  const metaHtml=meta.length?`<div class="task-meta">${meta.join(" · ")}</div>`:"";
  const s=timeToMin(t.time); let cd="";
  if(s!=null&&isActive(t)){ const d=s-nowMin();
    if(d>0&&d<=60) cd=`<span class="cd">in ${fmtDelta(d)}</span>`;
    else if(d===0) cd=`<span class="cd">now</span>`;
    else if(d<0) cd=`<span class="cd late">▲ ${fmtDelta(d)} late</span>`;
  }

  el.innerHTML=`
    <input type="checkbox" class="cbx" ${isDone(t)?"checked":""} aria-label="Done">
    <div class="pri" style="background:${priColor(t.priority)}" title="Priority ${t.priority}/10 — click to edit">${t.priority}<span class="fill"><i style="width:${t.priority*10}%"></i></span></div>
    <div class="r-who">${peopleChipsHtml(t.people)}</div>
    <div class="r-title"><div class="task-title">${esc(t.task)||"(untitled)"}</div>${metaHtml}</div>
    <div class="r-meta"><div class="cell-time"><span class="t ${t.time?'':'none'}">${t.time?esc(fmt12(t.time)):"—"}</span>${cd}</div></div>
    <div class="r-status"><select class="status-sel" style="background:${STATUS[t.status].color}" aria-label="Status">${statusOptionsHtml(t)}</select></div>
    <div class="rowactions"><button class="iconbtn edit" title="Edit">✎</button><button class="iconbtn del" title="Delete">✕</button></div>`;

  el.querySelector(".pri").addEventListener("click",()=>{ editingId=t.id; render(); });

  el.querySelector(".cbx").addEventListener("change",e=>{ t.status=e.target.checked?"done":"todo"; t.showOn=""; saveTasks(); render(); });
  el.querySelector(".status-sel").addEventListener("change",e=>{ const v=e.target.value;
    if(v==="tomorrow"){ t.status="later"; t.showOn=tomorrowLocal(t.time||"08:00"); saveTasks(); render(); }
    else if(v==="pickday"){ t.status="later"; if(!t.showOn) t.showOn=tomorrowLocal(t.time||"08:00"); editingId=t.id; render(); }
    else if(v==="later"){ /* no-op */ }
    else { t.status=v; t.showOn=""; saveTasks(); render(); } });
  el.querySelector(".edit").addEventListener("click",()=>{ editingId=t.id; render(); });
  el.querySelector(".del").addEventListener("click",()=>{ if(confirm(`Delete "${t.task||"this item"}"?`)){ tasks=tasks.filter(x=>x.id!==t.id); saveTasks(); render(); } });
  return el;
}

function renderEditor(t){
  const el=document.createElement("div"); el.className="editor"; el.dataset.id=t.id;
  el.innerHTML=`
    <div class="grid">
      <div class="field full"><label>What</label><input type="text" id="e-task" value="${esc(t.task)}" placeholder="e.g. Soccer practice, empty dishwasher"></div>
      <div class="field full"><label>Who it's for</label><div class="who-picker" id="e-who"></div></div>
      <div class="field"><label>Time</label><input type="time" id="e-time" value="${t.time||""}"></div>
      <div class="field"><label>Due date (optional)</label><input type="date" id="e-due" value="${t.due||""}"></div>
      <div class="field"><label>Due time (optional)</label><input type="time" id="e-duetime" value="${t.dueTime||""}"></div>
      <div class="field full"><label>Priority — <span id="e-prilabel">${t.priority}/10</span></label>
        <div class="prislider"><input type="range" id="e-pri" min="1" max="10" value="${t.priority}"><span class="prival" id="e-prival" style="background:${priColor(t.priority)}">${t.priority}</span></div>
      </div>
      <div class="field full"><label>Status</label><select id="e-status">${statusOptionsHtml(t)}</select></div>
      <div class="field full ${isLater(t)?"":"hidden"}" id="e-showon-wrap"><label>Comes back on</label><div class="reappear-inline"><input type="datetime-local" id="e-showon" value="${t.showOn||""}"><button type="button" class="btn" id="e-tmrw">Tomorrow</button></div></div>
      <div class="field full"><label>Notes</label><textarea id="e-notes" placeholder="Anything to remember…">${esc(t.notes)}</textarea></div>
    </div>
    <div class="actions"><button class="btn del-e">Delete</button><button class="btn cancel-e">Cancel</button><button class="btn add save-e">Save</button></div>`;

  const ss=el.querySelector("#e-status"), wrap=el.querySelector("#e-showon-wrap"), showon=el.querySelector("#e-showon");
  const whoPick=makeWhoPicker(el.querySelector("#e-who"), t.people);
  const pri=el.querySelector("#e-pri"), prival=el.querySelector("#e-prival"), prilabel=el.querySelector("#e-prilabel");
  const syncPri=()=>{ const v=+pri.value; prival.textContent=v; prilabel.textContent=v+"/10"; prival.style.background=priColor(v); pri.style.setProperty("--sliderc",priColor(v)); };
  pri.addEventListener("input",syncPri); syncPri();
  ss.addEventListener("change",()=>{ const v=ss.value;
    if(v==="tomorrow"){ showon.value=tomorrowLocal(el.querySelector("#e-time").value||"08:00"); wrap.classList.remove("hidden"); }
    else if(v==="pickday"||v==="later"){ if(!showon.value) showon.value=tomorrowLocal(el.querySelector("#e-time").value||"08:00"); wrap.classList.remove("hidden"); }
    else wrap.classList.add("hidden"); });
  el.querySelector("#e-tmrw").addEventListener("click",()=>{ showon.value=tomorrowLocal(el.querySelector("#e-time").value||"08:00"); });

  el.querySelector(".save-e").addEventListener("click",()=>{
    t.task=el.querySelector("#e-task").value.trim();
    t.people=whoPick.get();
    t.time=el.querySelector("#e-time").value;
    t.due=el.querySelector("#e-due").value;
    t.dueTime=el.querySelector("#e-duetime").value;
    t.priority=+el.querySelector("#e-pri").value;
    t.notes=el.querySelector("#e-notes").value.trim();
    const sv=ss.value;
    if(sv==="todo"||sv==="doing"||sv==="done"){ t.status=sv; t.showOn=""; }
    else { t.status="later"; t.showOn=showon.value||tomorrowLocal(t.time||"08:00"); }
    editingId=null; saveTasks(); render();
  });
  el.querySelector(".cancel-e").addEventListener("click",()=>{ if(!t.task&&!t.notes&&!t.time&&!t.due&&!t.people.length) tasks=tasks.filter(x=>x.id!==t.id); editingId=null; render(); });
  el.querySelector(".del-e").addEventListener("click",()=>{ if(confirm("Delete this item?")){ tasks=tasks.filter(x=>x.id!==t.id); editingId=null; saveTasks(); render(); } });
  setTimeout(()=>el.querySelector("#e-task").focus(),0);
  return el;
}

/* ---------------- shopping ---------------- */
function renderShop(){
  const el=document.getElementById("shopList");
  const sorted=[...shop].sort((a,b)=>((a.got?1:0)-(b.got?1:0)));
  el.innerHTML = shop.length ? "" : `<div class="empty-state" style="padding:24px 12px"><div class="big">List is empty.</div>Add what you need above.</div>`;
  sorted.forEach(s=>{
    const row=document.createElement("div"); row.className="shop-row"+(s.got?" got":""); row.dataset.id=s.id;
    row.innerHTML=`<input type="checkbox" class="cbx" ${s.got?"checked":""} aria-label="Got it"><span class="shop-text">${esc(s.item)}</span><button class="shop-del" title="Remove">✕</button>`;
    row.querySelector(".cbx").addEventListener("change",e=>{ s.got=e.target.checked; saveShop(); renderShop(); });
    row.querySelector(".shop-del").addEventListener("click",()=>{ shop=shop.filter(x=>x.id!==s.id); saveShop(); renderShop(); });
    el.appendChild(row);
  });
  renderFooterCounts();
}
function renderFooterCounts(){
  const left=shop.filter(s=>!s.got).length, got=shop.filter(s=>s.got).length;
  document.getElementById("shopStatus").textContent=`${left} to buy · ${got} got`;
  document.getElementById("shopCount").textContent=shop.length?`${left}`:"";
}
document.getElementById("shopInput").addEventListener("keydown",e=>{ if(e.key!=="Enter") return; const v=e.target.value.trim(); if(!v) return; shop.push(blankShop(v)); e.target.value=""; saveShop(); renderShop(); });
document.getElementById("shopClear").addEventListener("click",()=>{ if(!shop.some(s=>s.got)) return; shop=shop.filter(s=>!s.got); saveShop(); renderShop(); });

/* ---------------- places to go ---------------- */
function mapUrl(addr){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr); }
function placePeopleDots(ids){ ids=normPeople(ids); if(!ids.length) return ""; if(ids.includes("family")) return `<span class="pdot" style="background:${getPerson("family").color}" title="Family"></span>`; return ids.map(id=>{const p=getPerson(id);return `<span class="pdot" style="background:${p.color}" title="${esc(p.name)}"></span>`;}).join(""); }
function renderPlaces(){
  const el=document.getElementById("placeList");
  el.innerHTML = places.length ? "" : `<div class="empty-state" style="padding:24px 12px"><div class="big">No places yet.</div>Add somewhere to go above.</div>`;
  const sorted=[...places].sort((a,b)=>((a.visited?1:0)-(b.visited?1:0)) || (b.created||0)-(a.created||0));
  sorted.forEach(pl=>{ el.appendChild(placeEditingId===pl.id ? renderPlaceEditor(pl) : renderPlaceRow(pl)); });
  const active=places.filter(p=>!p.visited).length, visited=places.filter(p=>p.visited).length;
  document.getElementById("placeCount").textContent=places.length?`${active}`:"";
  document.getElementById("placeStatus").textContent=`${active} to visit · ${visited} visited`;
}
function renderPlaceRow(pl){
  const row=document.createElement("div"); row.className="place-row"+(pl.visited?" got":""); row.dataset.id=pl.id;
  const bits=[];
  if(pl.date) bits.push(`<span class="ptxt">${esc(fmtDate(pl.date))}</span>`);
  if(pl.address) bits.push(`<span class="ptxt">${esc(pl.address)}</span>`);
  if(pl.note) bits.push(`<span class="ptxt">${esc(pl.note)}</span>`);
  const dots=placePeopleDots(pl.people); if(dots) bits.push(dots);
  const metaHtml = bits.length?`<div class="place-meta">${bits.join('<span style="opacity:.4">·</span>')}</div>`:"";
  row.innerHTML=`
    <input type="checkbox" class="cbx" ${pl.visited?"checked":""} aria-label="Visited">
    <div class="place-body"><div class="place-name">${esc(pl.name)||"(unnamed)"}</div>${metaHtml}</div>
    ${pl.address?`<a class="mapbtn" href="${mapUrl(pl.address)}" target="_blank" rel="noopener">Map</a>`:""}
    <button class="place-edit" title="Edit">✎</button>
    <button class="place-del" title="Remove">✕</button>`;
  row.querySelector(".cbx").addEventListener("change",e=>{ pl.visited=e.target.checked; savePlaces(); renderPlaces(); });
  row.querySelector(".place-edit").addEventListener("click",()=>{ placeEditingId=pl.id; renderPlaces(); });
  row.querySelector(".place-del").addEventListener("click",()=>{ if(confirm(`Remove "${pl.name||"this place"}"?`)){ places=places.filter(x=>x.id!==pl.id); savePlaces(); renderPlaces(); } });
  return row;
}
function renderPlaceEditor(pl){
  const box=document.createElement("div"); box.className="place-editor"; box.dataset.id=pl.id;
  box.innerHTML=`
    <div class="pe-field"><label>Place</label><input type="text" id="pe-name" value="${esc(pl.name)}" placeholder="e.g. Costco"></div>
    <div class="pe-field"><label>Address (optional)</label><input type="text" id="pe-addr" value="${esc(pl.address)}" placeholder="for the map button"></div>
    <div class="pe-field"><label>Reason / note (optional)</label><input type="text" id="pe-note" value="${esc(pl.note)}" placeholder="why / what for"></div>
    <div class="pe-field"><label>Date (optional)</label><input type="date" id="pe-date" value="${pl.date||""}"></div>
    <div class="pe-field"><label>Who's going (optional)</label><div class="who-picker" id="pe-who"></div></div>
    <div class="pe-actions"><button class="btn sm del-pe">Delete</button><button class="btn sm cancel-pe">Cancel</button><button class="btn sm add save-pe">Save</button></div>`;
  const who=makeWhoPicker(box.querySelector("#pe-who"), pl.people);
  box.querySelector(".save-pe").addEventListener("click",()=>{
    pl.name=box.querySelector("#pe-name").value.trim();
    pl.address=box.querySelector("#pe-addr").value.trim();
    pl.note=box.querySelector("#pe-note").value.trim();
    pl.date=box.querySelector("#pe-date").value;
    pl.people=who.get();
    placeEditingId=null; savePlaces(); renderPlaces();
  });
  box.querySelector(".cancel-pe").addEventListener("click",()=>{ if(!pl.name&&!pl.address&&!pl.note&&!pl.date&&!pl.people.length) places=places.filter(x=>x.id!==pl.id); placeEditingId=null; renderPlaces(); });
  box.querySelector(".del-pe").addEventListener("click",()=>{ places=places.filter(x=>x.id!==pl.id); placeEditingId=null; savePlaces(); renderPlaces(); });
  setTimeout(()=>box.querySelector("#pe-name").focus(),0);
  return box;
}
document.getElementById("placeInput").addEventListener("keydown",e=>{ if(e.key!=="Enter") return; const v=e.target.value.trim(); if(!v) return; places.unshift(blankPlace(v)); e.target.value=""; savePlaces(); renderPlaces(); });
document.getElementById("placeClear").addEventListener("click",()=>{ if(!places.some(p=>p.visited)) return; places=places.filter(p=>!p.visited); savePlaces(); renderPlaces(); });

/* ---------------- quick add / add ---------------- */
document.getElementById("quickInput").addEventListener("keydown",e=>{ if(e.key!=="Enter") return; const v=e.target.value.trim(); if(!v) return; const t=blankTask(v); if(activePerson!=="all") t.people=[activePerson]; tasks.unshift(t); e.target.value=""; saveTasks(); render(); });
document.getElementById("addBtn").addEventListener("click",()=>{ const t=blankTask(); if(activePerson!=="all") t.people=[activePerson]; tasks.unshift(t); editingId=t.id; render(); });

/* ---------------- toolbar ---------------- */
["searchInput","sortBy","hideDone","showLater"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("printBtn").addEventListener("click",()=>window.print());
document.getElementById("exportBtn").addEventListener("click",()=>{
  const bundle={version:VERSION,people,tasks,shop,places};
  const blob=new Blob([JSON.stringify(bundle,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`home-planner-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!confirm("Import this file? It replaces your current planner.")) return;
    if(Array.isArray(d)){ tasks=d.map(migrateTask); }
    else { if(Array.isArray(d.people)) people=d.people; if(Array.isArray(d.tasks)) tasks=d.tasks.map(migrateTask); if(Array.isArray(d.shop)) shop=d.shop.map(s=>Object.assign(blankShop(),s)); if(Array.isArray(d.places)) places=d.places.map(migratePlace); }
    editingId=null; placeEditingId=null; savePeople(); saveTasks(); saveShop(); savePlaces(); render();
  }catch(err){ alert("Couldn't read that file — expected a Home planner export (.json)."); } };
  r.readAsText(f); e.target.value="";
});

/* ---------------- tick ---------------- */
function tick(){ const d=new Date(); document.getElementById("clock").innerHTML=`${pad2(d.getHours())}:${pad2(d.getMinutes())}<span class="sec">:${pad2(d.getSeconds())}</span>`;
  if(editingId==null){ if(normalizeLater()){ render(); return; }
    const no=new Set(tasks.filter(isOverdue).map(t=>t.id)); let ch=no.size!==overdueSet.size; if(!ch) for(const i of no) if(!overdueSet.has(i)){ ch=true; break; }
    if(ch){ render(); return; }
    renderNextUp(computeNextUp());
    document.querySelectorAll(".row").forEach(row=>{ const t=tasks.find(x=>x.id===row.dataset.id); const c=row.querySelector(".cell-time"); if(!t||!c) return; const s=timeToMin(t.time); let cd=""; if(s!=null&&isActive(t)){ const dd=s-nowMin(); if(dd>0&&dd<=60)cd=`<span class="cd">in ${fmtDelta(dd)}</span>`; else if(dd===0)cd=`<span class="cd">now</span>`; else if(dd<0)cd=`<span class="cd late">▲ ${fmtDelta(dd)} late</span>`; } c.innerHTML=`<span class="t ${t.time?'':'none'}">${t.time?fmt12(t.time):"—"}</span>${cd}`; });
  }
}

/* ---------------- init ---------------- */
document.getElementById("datestr").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
render(); initSync(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
